
name: Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Run automated tests
        if: always() && steps.install.outcome == 'success'
        run: pytest -v

      - name: Run Bandit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          bandit -r app -f json -o reports/bandit-report.json

      - name: Run Semgrep
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app

      - name: Run pip-audit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
            pip-audit -r requirements.txt -f json -o reports/dependency-report.json

      - name: Build Docker image
        id: docker_build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          docker build -t vulnfinbot:latest .

      - name: Run Trivy image scan
        if: always() && steps.docker_build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulnfinbot:latest
          scan-type: image
          format: json
          output: reports/trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
